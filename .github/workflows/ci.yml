name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "aprsc**"
      - "*[Dd]ocker**"
      - "**.md"

  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: test build
        env:
          repo: ${{ github.repository }}
          sha: ${{ github.sha }}
        run: docker build . --file Dockerfile --tag ${repo}:${sha}-$(date +%s)

  publish-ghcr:
    needs: test
    if: ${{ github.event_name == 'push' }}
    name: publish
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      environment_name: ghcr.io Registry
      environment_url: https://github.com/uiolee/aprsc-docker/pkgs/container/aprsc
      registry: ghcr.io
      image_name: "${{ github.repository_owner }}/aprsc"
      target_platforms: "linux/amd64"
    secrets: inherit

  publish-dch:
    needs: publish-ghcr
    if: ${{ github.event_name == 'push' }}
    name: publish
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      environment_name: docker.io Registry
      environment_url: https://hub.docker.com/r/uiolee/aprsc
      registry: docker.io
      image_name: "${{ github.repository_owner }}/aprsc"
      target_platforms: "linux/amd64"
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
