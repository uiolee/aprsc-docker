name: Publish

on:
  workflow_call:
    inputs:
      environment_name:
        description: ""
        required: true
        type: string
      environment_url:
        description: ""
        required: true
        type: string
      runs_on:
        description: "ubuntu-latest"
        required: false
        default: "ubuntu-latest"
        type: string
      registry:
        description: "registry domain"
        required: false
        default: "ghcr.io"
        type: string
      registry_username:
        description: "registry username"
        required: false
        default: ""
        type: string
      registry_password:
        description: "registry password"
        required: false
        default: ""
        type: string
      image_name:
        description: "NAMESPCAE/PKGNAME"
        required: true
        type: string
      push_to_registry:
        description: ""
        required: false
        default: true
        type: boolean
      target_platforms:
        description: "platforms pass to docker/build-push-action"
        required: false
        default: "linux/amd64"
        type: string
      push_attest:
        description: ""
        required: false
        default: true
        type: boolean

    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
jobs:
  publish:
    name: Publish to ${{ inputs.registry }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      attestations: write
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
      artifact-metadata: write
    env:
      image_name: ${{ inputs.image_name || github.repository }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to registry `${{ inputs.registry }}`
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username || inputs.registry_username || github.repository_owner }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.registry }}/${{ env.image_name }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: ${{ inputs.target_platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.registry }}/${{ env.image_name }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: ${{ inputs.push_attest }}
